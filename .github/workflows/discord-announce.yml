name: Discord Changelog Announcer

on:
  push:
    branches:
      - main
    paths:
      - 'changelog.html'

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse latest changelog entry
        run: node .github/workflows/scripts/parse-changelog.js

      - name: Send notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Error: DISCORD_WEBHOOK_URL is not set as a repository secret."
            exit 1
          fi
          
          # Read the parsed changelog content
          CHANGELOG_TEXT=$(cat changelog_parsed.txt)
          
          # Escape JSON characters for the webhook payload using python
          PAYLOAD=$(python3 -c '
          import json, sys
          content = sys.stdin.read()
          payload = {"content": content}
          print(json.dumps(payload))
          ' <<< "$CHANGELOG_TEXT")
          
          # Post to Discord
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
