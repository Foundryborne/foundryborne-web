<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/foundryborne.png">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">

  <!-- Early Theme Detection to avoid FOUC -->
  <script>
    (function() {
      const storedTheme = localStorage.getItem('foundryborne_theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = storedTheme ? storedTheme : (systemPrefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- SEO Meta Tags -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/foundryborne.png">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <!-- Persistent Sticky Header -->
  {% include header.html %}

  <!-- Main Content Wrapper -->
  <main>
    {{ content }}
  </main>

  <!-- Global Footer -->
  {% include footer.html %}

  <!-- Lightbox Image Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="Close Lightbox"><i class="fa-solid fa-xmark"></i></button>
      <img src="" alt="Screenshot Full View" class="modal-img" id="modal-img">
    </div>
  </div>

  <!-- Main JS Script -->
  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>
</html>
