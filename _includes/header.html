<header class="site-header">
  <div class="container header-container">
    <a href="{{ site.baseurl }}/" class="brand">
      <img src="{{ site.baseurl }}/assets/foundryborne.png" alt="Foundryborne Logo" class="brand-logo">
      <span class="brand-title">Foundryborne</span>
    </a>

    <nav class="nav-wrapper">
      <ul class="nav-menu" id="nav-menu">
        <li><a href="{{ site.baseurl }}/"
            class="nav-link {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">Home</a></li>
        <li><a href="{{ site.baseurl }}/features.html"
            class="nav-link {% if page.url contains 'features' %}active{% endif %}">Features</a></li>
        <li><a href="{{ site.baseurl }}/content.html"
            class="nav-link {% if page.url contains 'content' %}active{% endif %}">Premium Content</a></li>
        <li><a href="{{ site.baseurl }}/faq.html"
            class="nav-link {% if page.url contains 'faq' %}active{% endif %}">FAQ</a></li>
        <li><a href="{{ site.baseurl }}/team.html"
            class="nav-link {% if page.url contains 'team' %}active{% endif %}">Team</a></li>
        <li><a href="{{ site.docs_url }}" target="_blank" rel="noopener" class="nav-link">Docs <i
              class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.75rem;"></i></a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a href="{{ site.discord_url }}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm"
        title="Join Discord">
        <i class="fa-brands fa-discord"></i>
      </a>
      <a href="{{ site.github_repo }}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm"
        title="GitHub Repository">
        <i class="fa-brands fa-github"></i>
      </a>

      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Theme">
        <i id="theme-icon" class="fa-solid fa-moon"></i>
      </button>

      <a href="https://foundryvtt.com/packages/daggerheart" target="_blank" rel="noopener"
        class="btn btn-install btn-sm">
        <i class="fa-solid fa-download"></i> Install System
      </a>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Navigation Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </div>
</header>
